<p>コマンドラインからDNML文書を指定した際の不具合を修正しました．

<p><a name=brief></a>概要
<br>&amp;amp;nbsp;
<blockquote>現在，花梨さんの<a href=https://web.archive.org/web/20060717182943/http://www.vector.co.jp/authors/VA015183/ target=_top>DNML</a>のJava版ブラウザを作成中なのですが，Susieプラグインが使えないため独自に市販ゲーム用の画像ローダを用意しなければならないというのが，一番の課題としてあります．
<p>私自身そういった類の画像ローダを作成したことがなく，また，DNMLブラウザ自体のコーディングもまだやるべきことが多いため，画像ロードプラグイン，もしくはアーカイブ展開プラグインの作成という形で皆さんにご協力いただければ幸いです．
<p>また，Susie用プラグインのソースを公開していらっしゃる方，もしくは公開している場所を知っているという方がいらっしゃれば，ご一報いだたけると幸いです．このページからリンクさせていただければ，プラグイン作成のための強力な情報となると思います．
<p>下記SDKに，現時点でのDNML実装がTechnology Previewとして同梱されています．まだ未実装の機能も多数ありますが，お試しください．各種設定は，機能としては存在するものの，ユーザインタフェースを作るのが面倒で，まだ変更できません．各種ウェイトはWindows版DNMLと同程度，エフェクトのクオリティは速度優先で質を落とした設定に固定されています．
<p>開発目的の個人的な譲渡を除き，SDKまたはその一部を再配布することは禁止します．ただし，例外も有りなので，その辺りはご相談ください．
<p>正式なDNMLブラウザのライセンス形態に関しては，花梨さんのWindows版DNMLに準じたものにする予定です．ご協力いただいたプラグインに関しては，DNMLブラウザの配布時に同梱させていただきたいと考えていますが，ご希望であれば別途配布という形でも，もちろんかまいません．
<p>事務的な事や開発上の事を問わず，何か疑問点がありましたら，<a href=https://web.archive.org/web/20060717182943/http://bbs1.otd.co.jp/esi/bbs_tree target=_top>掲示板</a>に書き込んでください．また，プラグインの開発をはじめた，という方がいらっしゃいましたら，お知らせください．バグ報告もお待ちしています．(メールは<a href=https://web.archive.org/web/20060717182943/mailto:j-saito@cyborg.ne.jp>Tabris</a>
(j-saito@cyborg.ne.jp)までどうぞ)
<p>アプリケーションとしての名前を募集しています．良い感じの名前を思いついたら，是非:-)
<p>本ソフトウェアに関係する一切の事象に対し，Electric Sheep Inc.とTabrisは
責任を持たないこととします．</p></blockquote>
<p><br>
<hr size=0 width=100%25>
<p><a name=environment></a>動作環境
<br>&amp;amp;nbsp;
<blockquote>(Windows環境の方は，ここは気にしなくても，<a href=%23download>Windows Performance Pack</a>に必要なファイルがすべて含まれています)
<p>jdk1.1以上の環境で動作するはずです．WindowsもしくはSolarisを使用しているプラグイン開発者は<a href=https://web.archive.org/web/20060717182943/http://java.sun.com/products/jdk/1.3/ja/>jdk
1.3(開発環境)</a>を，一般ユーザは<a href=https://web.archive.org/web/20060717182943/http://java.sun.com/products/jdk/1.3/ja/jre/>jre
1.3(実行環境のみ)</a>をご利用ください．それ以外のOSでの実行に関しては，<a href=https://web.archive.org/web/20060717182943/http://java.sun.com/cgi-bin/java-ports.cgi>Java
Platform Ports</a>や，各OSのWeb等を参照してください．
<p>音を鳴らすためには<a href=https://web.archive.org/web/20060717182943/http://java.sun.com/products/java-media/jmf/index.html target=_top>Java Media Framework (JMF)</a>が必要です．JMFがインストールされていない場合，CD再生以外のBGM・SOUNDは鳴りません．使用しているOSがWindowsかSolarisならば，それぞれのPerformance Pack版をインストールした方が良いでしょう．それ以外の場合はCross-platform版をインストールしてください．
<p>開発中の動作確認は以下の環境で常時行っています．
<p>jdk1.3 on Windows NT 4.0j Workstation with JMF2.1 Windows Performance Pack (メイン開発環境)
<br>jdk1.2.2 RC3 on Kondara MNU/Linux v1.0
<p>Windows系OSでの動作がもっとも快適です．ただし，Windows 9xでは，一部の環境で起動しないなどの問題があるかもしれません．
<p>Linuxでの動作も，JITコンパイラのおかげでかなり良好です．何らかの理由でJITコンパイラが使用できない場合は，<a href=%23ex_nativerenderer>ネイティブコード</a>を利用してください．
<p>メモリは最大40～50MB(jdk1.3の場合)消費します．jdk1.1.xの場合，-mx64等として最大ヒープサイズを大きくしてやらないと正常に動作しないかもしれません．</p></blockquote>
<hr size=0 width=100%25>
<p><a name=limitation></a>制限事項
<br>&amp;amp;nbsp;
<blockquote>アーカイブファイルの直接閲覧では，アーカイブ中に複数の文書が含まれていた場合，どの文書を閲覧するかを選択することは現在できません．(近日中に修正予定です)
<p>非ASCIIファイル名が問題となる可能性があるため，環境設定.dnmlはsetenv.dnmlに置き換えられています．尚，それに伴うDNML文書の書き換えは必要なく，今まで通り 環境設定.dnmlの名前でINCLUDEできます．
<p>PLAYERエイリアスはWindows版と同じくDNML.classのあるディレクトリを指しています．標準添付のテンプレートはtemplates.icpに入っていますが，templates.icpの中身は自動的にDNML.classと同じディレクトリにあるように扱われます．templates.icpの中身を書き換える場合，展開/圧縮には必ずJDK付属のJARツールを使用してください．
<p>エラーが報告される場合，出力先は標準出力に固定されています．
<p>グラフィックのレンダリング周りの最適化には力を入れています．ですが，それ以外の部分は速度よりも実装のやりやすさを優先していますので，無駄が多くなっています．
<p>フォントに関してはVM側で適当なマッピングがなされるはずですが，手動でマッピングする事もできます．他の設定同様，GUIはまだありませんので，DNMLPrf.iniを直接編集してください．jdk1.2系ならばシステムのフォント名をそのまま，jdk1.1系ならばJava用の抽象フォント名をマップして下さい．デフォルトで明朝系はserifに，ゴシック系はsansserifに，ＬｅａｆはLeafにマッピングされています．jdk1.2系で，ＭＳ
明朝等のフォントがシステムにインストールされているならば，マッピングを削除すると良いでしょう．
<p>環境によっては，表示が数ピクセルずれて表示される事があるようです．原因は調査中です．
<p>廃止されるなどしてリファレンスに記述されていない古い仕様に関しては，その殆どに対応していません．私が知らないので，不可能です．
<p>廃止されたタグとしてリファレンスに記述されている仕様のうち，FONTタグのTOP,LEFT属性は未対応です．POSITIONタグのMODE属性に関しても，仕様がはっきりしないため未対応です．
<p>以前に作成したHTMLパーザを流用しているという事情から，DNML文書読み込み時にコメントの仕様を適合させるためのフィルタを通すという，根本的とは言えない対処をしています．フィルタの不具合により何らかの問題が起きる可能性があります．
<p>文字列リソースは日本語のみ用意されています．他国語への翻訳者を求めています．
<p>最初DNMLの仕様を誤解して設計しその後修正する，という場面が何度かあり，結果として当初の分析から外れた設計になってしまい，あまり納得のいかない安定性になっています．設計見直しをし，修正を図りたいと思います．
<p>まだ仕様を誤解しているタグはあるでしょう．
<p>未実装のタグ処理があります．以下のタグは動作しません．
<p><b><u>CURSOR</u></b>
<p>jdk1.1系では画像をカーソル化する事ができないため，非対応です．jdk1.2系のVMで実行したときのみ有効にするような処理を予定しています．
<p><b><u>FORM，INPUT</u></b>
<p>座標指定でのコンポーネントのレイアウトは非常に簡単であることがわかりました．いずれ対応します．
<p><b><u>COMMAND</u></b>
<p>設定変更のためのユーザインタフェースが未実装のため，常に無効になっています．
<p><b><u>SNAP</u></b>
<p>画像保存はメニューから実行可能ですが，SNAPタグによる保存はまだ実装されていません．近日中に実装されます．</p></blockquote>

<p><a name=extension></a>拡張機能
<br>&amp;amp;nbsp;
<blockquote><a name=ex_archiveview></a>アーカイブファイルの直接閲覧が可能です．メニューから「DNML文書を開く」を選択し，ファイル選択ダイアログボックスでアーカイブファイル(LZHかZIP)を通常の.dnmlファイルと同様に選択すると，自動的にアーカイブ内が検索され，文書が開かれます．一つのDNML文書を一つのファイルとして管理できるため，見通しが良くなるでしょう．
<p><a name=ex_saveimageformat></a>「画像を保存」では多くのファイルフォーマットに対応しています．現在の対応フォーマットはPNG・Windows BMP・JPEG・PICT・Photoshop v2.5・Sun Raster・TGA・X PixelMap・X BitMap・PCXです．
<p><a name=ex_lastbranch></a>「一つ前の選択肢に戻る」が実装されています．LVNSなどに見られる，最後に選んだ選択肢を選び直せる機能です．
<p><a name=ex_scenarioreflection></a>「シナリオ回想」が実装されています．LVNSなどに見られる，以前に読んだシナリオを読み直せる機能です．シナリオ回想モードでは，ウィンドウの上半分をクリックするとより前の文章が，下半分をクリックするとより後の文章が表示されます．「回想」できるのは50ページにかぎられています．
<p><a name=ex_infopreview></a>Swingがインストールされている(jdk1.2以上では標準添付)場合，ファイル選択ダイアログボックスで，選択中のファイルのメタデータ(作者名，タイトルなどの情報)が表示されます．メタデータの読み込みは，昔の標準ヘッダ形式とCOVERタグの両方に対応しています．
<p><a name=ex_activetrans></a>文章表示で，クリック待ちの後，次の文章が表示される際に，以前の文章の色が自動的に半透明になるようにできます．新たに表示された文章に視線を自然に集中させることを意図したものですが，まだ粗削りで洗練されていません．通常のインストールではこの機能は無効になっていますので，使用したい場合はDNMLPrf.iniをテキストエディタで開いて[Visualization]セクションのUseActiveTrans = falseの行をUseActiveTrans = trueと変更してください．この件に関しては<a href=https://web.archive.org/web/20060717182943/http://cgi.cyborg.ne.jp/~j-saito/cgi-bin/diary.cgi?200001%2323_kadokusei target=_top>日記</a>に短い記述があります．
<p><a name=ex_bure></a>従来は，(特にLVNSのようなスタイルのゲームで)キャラ画像切り替えの際，重心のずれにより絵がぶれることが頻繁にありました．これはDNMLのアライメント仕様によるものです．Java版DNMLブラウザでは，この&amp;quot;ぶれ&amp;quot;を自動的に補正して，違和感をなくすようにしています．補正に対応しているゲームは現在のところ痕・ToHeart・ONEです．ただし，各ゲームのテンプレートでデフォルトのleft位置を指定するという方式のため，独自のテンプレートを持っている場合(綾Ｄなど)は補正されません．ぶれない位置の座標データは<a href=https://web.archive.org/web/20060717182943/http://www.din.or.jp/~hiragi/ target=_top>RuevickQubeさん</a>の「キャラぶれ撲滅講座」シリーズのものを使用させていただいています．ありがとうございます．
<p><a name=ex_nativerenderer></a>使用したければ，レンダラにネイティブコードが使用できます(オプションですので，使用しなくてもかまいません)．ネイティブコードを使用する場合は，同梱のelectricsheep_lib2d_ImageRendererNative.cppをライブラリ名がelectricsheep_lib2d_ImageRendererNativeになるように(shared objectとして)コンパイルしてライブラリパスが通った場所に置いてください．ファイル名としては，UNIX属OSならばlibelectricsheep_lib2d_ImageRendererNative.soにする事になるはずです．DNMLブラウザのバージョンが上がった場合，必ずlib～.soも再コンパイルしてください．で，FreeBSDで正常にネイティブコードが動かせた人は連絡ください:-) 私の環境だとメソッド呼び出し時(ライブラリロード時ではなく)にUnsatisfiedLinkError吐くので・・・ Linuxでなら動いてるんですけど．(醜悪なソースなのは，自作のJava-&amp;amp;gt;Cトランスレータによって変換しているためです:-P マクロ展開みたいな事もしているので行数も倍以上になってますしね・・・)
<p><a name=ex_leaffont></a>リーフフォントをそれぞれの環境用に形式変換しなくても，直接DNMLブラウザから利用可能です．リーフフォント(knj_all.knjファイル)が存在しない，またはリーフフォント中に当該文字が存在しない，またはサイズが24ポイントではない場合は，その環境のserifタイプのフォントが自動的に代替使用されます．デフォルトではinstall/下にある雫・痕・ToHeart全てのリーフフォントを使用します(どれかがインストールされていなくてもかまいません)．ほかの場所にインストールされている場合はsetenv.dnmlを編集してください．フォントのマッピング名は，&amp;quot;Leaf&amp;quot;です．DNMLPrf.iniではデフォルトでＬｅａｆはLeafに割り当てられています．
<p><a name=ex_antialiasing></a>どのような環境で使用しても，文章表示にはアンチエイリアシングが施され，旧バージョンと比べ可読性が大幅に向上しています．(アンチエイリアシング機能の無効化には現在対応していません) ただし，リーフフォントはビットマップフォントであるためアンチエイリアシングはかかりません．
<p><a name=ex_encoding></a>Shift_JIS，EUC-JP，ISO-2022-JPを含む，複数の文字エンコーディングに暫定的に対応しています．<a target=_top href=https://web.archive.org/web/20060717182943/http://www.isi.edu/in-notes/iana/assignments/character-sets>IANAのassignment</a>に従ったエンコーディング名を使用して，HTMLのMETAタグと同じ形式で指定することができます．デフォルトでShift_JISとして扱われるので，EUC-JPを使用するなど，特殊なことをしない限り，記述方法に変更はありません．この機能は実験的なものです．記述方法の仕様に関しては現在花梨さんと協議中であり，近い将来に変更される可能性が高いと思います．
<p><a name=ex_fullcolor></a>画面の色数は65536色でなくても動きます．殆どの方は通常はフルカラー環境だと思いますので，切り替えなくて良い分便利です．ゲームの画像自体がフルカラーでなくても，基本的に65536色化の時点で(パレットの関係で)色味が変わってしまいますから，フルカラー環境での閲覧はオリジナルに忠実な色味の再現という意味でもメリットがあります．Kanonあたりは画像自体がフルカラーという話ですから，そういった場合はより目立った効果が得られるでしょう．
<p><a name=ex_preload></a>画像の先行ロードを行います．DNMLブラウザは，文字表示中はCPUの負荷が低く殆ど遊んでいる状態ですが，画像にエフェクトをかけている間はかなりの負荷がかかるなど，CPU負荷の偏りが激しいアプリケーションです．負荷を時間軸でなるべく分散させることで，よりなめらかなエフェクト効果が期待できます．そこで，1ページの中であらかじめ使用される事が確定している画像を，文字表示と同時に，優先度の低い裏スレッドで予めロードしておき，画像ロードの負荷を文字表示時間にスライドさせます．よって，改ページ直後に使用される画像に関してはあまり効果はありませんが，ページ中盤以降に使用される画像の表示は幾分高速に行われます．マルチプロセッサ環境で特に効果的です．(これと関連して，文字表示中に将来の画像のエフェクトアニメーションのレンダリングを先行して行う機能も検討し，実装もほぼ固まりましたが，メモリ効率の悪さとのトレードオフにより却下しました)</p></blockquote>

<p><a name=development></a>開発方法
<br>&amp;amp;nbsp;
<p>
<blockquote>100%25 Pure Javaでお願いします．
<p>例えばネイティブメソッド経由でSusieプラグインのDLLを叩けばロードできますが，Windowsに縛られるようではJava版としての意味がありませんので．
<p>今後，インタフェースに変更等がある場合は，既存のインタフェースをextendsする形で新インタフェースを定義しますので，互換性に関しての心配は必要ありません．
<p>近いうちにDNML4J以外のアプリケーションからも各プラグインを利用可能にするためのライブラリ(ソースコード込)を公開します．
<p><b><u>インタフェース</u></b>
<p>プラグインは，所定のインタフェースを実装する形で作成していただきます．
<p><b><u>アーカイブ展開プラグイン</u></b>
<p>アーカイブ展開プラグインは，以下のインタフェースを実装したものとなります．
<pre>package electricsheep.libio;

import java.io.*;

public interface ArchiveReaderPlugin
{
    public static final int SUPPORT_CERTAINLY = 3;
    public static final int SUPPORT_MAY_WELL = 2;
    public static final int SUPPORT_MAYBE = 1;
    public static final int SUPPORT_NOT = 0;

    public String getAuthor();
    public String getDescription();
    public int getVersion();

    public String[] getCompatibleSusiePlugin();
    public int getSupportLevel(byte[] head, String file);

    public InputStream getInputStream(String archive, String entry) throws IOException;
    public String[] getEntryList(String archive) throws IOException;
}</pre>
<p>getInputStreamでは，archiveがアーカイブのファイル名を，entryがアーカイブ内でのエントリ名を示します．archiveはそのプラットホームのファイル名表現で，entryは(ディレクトリ付きの場合)ファイル区切りを/としたファイル名表現です．これらの引数で特定されるアーカイブ内のエントリを表すInputStreamを返します．何らかの理由でエントリを展開できない場合，IOExceptionをthrowします．アーカイブをInputStreamの形で渡さないのには，RandomAccessFileを使いたい場合が多いだろうという理由のほかに，効率のためプラグイン内部でアーカイブを開いたままにしておきたい場合があるだろうという理由があります．
<p>getEntryListでは，archiveがアーカイブのファイル名を示します．そのアーカイブに含まれるエントリのファイル名をすべて，配列の形で返します．ディレクトリ付きのアーカイブでファイル名区切りが必要な場合，/を使用します．何らかの理由でエントリが取得できない場合，IOExceptionをthrowします．
<p>プラグインインタフェースでは，ファイル名には全て通常のString(すなわちUnicode文字列)を使用します．アーカイブ中のファイル名に非ASCII文字が含まれる可能性がある場合，プラグイン内部で適宜Unicodeに変換してください．
<p>SDKサンプルとして，LeafのPAK形式にアクセスするプラグインとjava.util.zipを使ってZip形式のアーカイブにアクセスする非常に簡単なプラグインのソースを添付しましたので，参考になさってください．
<p><b><u>画像ロードプラグイン</u></b>
<p>画像ロードプラグインは，以下のインタフェースを実装したものとなります．
<pre>package electricsheep.lib2d;

import java.io.*;

public interface ImageLoaderPlugin
{
    public static final int SUPPORT_CERTAINLY = 3;
    public static final int SUPPORT_MAY_WELL = 2;
    public static final int SUPPORT_MAYBE = 1;
    public static final int SUPPORT_NOT = 0;

    public String getAuthor();
    public String getDescription();
    public int getVersion();

    public String[] getCompatibleSusiePlugin();
    public int getSupportLevel(byte[] head, String file);

    public ImageData loadImage(InputStream in, String file) throws IOException;
}</pre><p>loadImageメソッドは，inからロードすべき画像データを取得し，ImageDataオブジェクトに格納して返します．fileはInputStreamがファイルに支持されている場合はファイル名ですが，ファイルに支持されていない場合は長さゼロの文字列です．何らかの理由で画像がロードできない場合，IOExceptionをthrowします．ImageDataクラスは以下の形をしています．
<pre>package electricsheep.lib2d;

public class ImageData
{
    public java.awt.Dimension size;
    public int[] pixels;
    public int bitCount;
    public boolean isARGB;
    public java.awt.Rectangle clip;

    public ImageData()
    {
        size = new java.awt.Dimension();
    }
}</pre>
<p>sizeには画像のサイズを，pixelsには画像のピクセルデータを，bitCountには色数情報を格納します．
<p>pixels.lengthはsize.width * size.heightと等しくなります．個々のint値は，alpha値をビット24～31で，赤色成分をビット16～23で，緑色成分をビット8～15で，青色成分をビット0～7で表します．(要するに，java.awt.Color互換です) 元の画像データにalpha値が含まれていない場合は，完全な不透明として，alpha値は0xffとして扱ってください．
<p>bitCountは，画像の色数をビット数で表したものですが，DNMLの「痕対策として16色(4bpp)画像は右上を透明色とする」という仕様を満足するためのものですので，4bppでないのならば，24等として適当に埋めておいてください．(16色の場合，bitCount
== 4ということになります)
<p>isARGBは，pixelsの要素が正しいalpha値を持っているかどうかを表します．例えばLeafのLF2形式には透明色情報が含まれているため，pixelsのalpha値を正しくセットしていますので，isARGBはtrueとなりますが，WindowsBMP形式には透明色情報は含まれないため，isARGBは常にfalseとなっています．(現状の実装ではisARGBが有効になっている場合DNMLタグでのTRANSPARENT情報は無視されますが，今後DNML側でのタグ仕様の変更によりこの動作は変わる可能性があります)
<p>clipは，画像のうち実際に有効な矩形が限られている場合に指定できます．画像データは大きいが，周辺部分が透明色であり，レンダリングすべき範囲が限られている場合等にセットしてください．(必要ない場合はnullのままにしておきます)
<p>SDKサンプルとして，LeafのLFG・LF2形式の画像にアクセスするプラグインとToolkit.createImageを使ってJPEG・GIF・XBM形式の画像にアクセスする非常に簡単なプラグインのソースを添付しましたので，参考になさってください．
<p><b><u>共通メソッド</u></b>
<p>アーカイブ展開プラグインと画像ロードプラグインは，以下のような共通のメンバを実装します．
<pre>    public static final int SUPPORT_CERTAINLY = 3;
    public static final int SUPPORT_MAY_WELL = 2;
    public static final int SUPPORT_MAYBE = 1;
    public static final int SUPPORT_NOT = 0;

    public String getAuthor();
    public String getDescription();
    public int getVersion();

    public String[] getCompatibleSusiePlugin();
    public int getSupportLevel(byte[] head, String file);</pre>
<p>getAuthorは，プラグイン作者の名前を返します．
<p>getDescriptionは，プラグインの(人が読むための)名前を返します．
<p>getVersionは，プラグインのバージョンを返します．形式は0xmmnnの形にしてください．mmはメジャーバージョン番号，nnはマイナーバージョン番号です．例えばver2.56の場合は0x0238です(56は16進数で0x38)．
<p>getCompatibleSusiePluginは，互換となるSusieプラグイン名の配列を返します．互換となるSusieプラグインが無い場合，長さゼロの配列を返します．
<p>getSupportLevelは，データの先頭部分のバイト列(head)と(データがファイルに支持されている場合は)データのファイル名(file)をもとにして，プラグインが対応しているデータかどうかをサポートレベルとして4段階の整数により返します．4段階の整数とはSUPPORT_CERTAINLY・SUPPORT_MAY_WELL・SUPPORT_MAYBE・SUPPORT_NOTのいずれかです．SUPPORT_CERTAINLYは確実に対応していることを，SUPPORT_MAY_WELLは対応していると思われることを，SUPPORT_MAYBEは対応している可能性があることを，SUPPORT_NOTは確実に非対応であることを，それぞれあらわします．headの長さの上限は規定されていませんが，最低1024の長さを持つbyte配列であることが保証されています．(データの全体長が2048バイト以下でも，headの長さは2048以上あり，残りはゼロで埋められています) ファイル名も渡されますが，ファイル名がどうであれ展開できるように，あまりファイル名には頼らないでください．データがファイルに支持されていない場合は，fileは長さゼロの文字列です．フォーマットの特性上先頭の2048バイトからは判断できない場合，SUPPORT_MAYBEを返すことが推奨されています．
<p><b><u>パッケージ</u></b>
<p>各インタフェースはelectricsheep.libioパッケージとelectricsheep.lib2dパッケージに属していますが，プラグインに関してはパッケージの制限はありません．
<p>各作者ごとに独自のパッケージ名を利用してください．
<p><b><u>プラグインロード機構</u></b>
<p>プラグインは，開発したクラス群をjarフォーマットにまとめて，jarファイルの拡張子をicpにしてDNML4Jと同じディレクトリに置いておくだけで自動的に認識され，使用されます(CLASSPATHの設定は不要です)．ICPファイルは拡張子が異なるだけでjarファイルと同じです．プラグインを単体で配布する場合は，ICPファイルだけをそのまま配布することができます．
<p>プラグイン開発中には，ソースコードを変更してコンパイルする毎にjarコマンドでICPファイルを作っていたのでは煩雑なので，別の手段でDNML4Jにプラグインの存在を認識させることもできます．ICPを使わずにプラグインを認識させるには，カレントディレクトリに代替テキストファイルを&amp;quot;archivereaderplugin.txt&amp;quot;(アーカイブ展開プラグイン用)または&amp;quot;imageloaderplugin.txt&amp;quot;(画像ロードプラグイン用)という名前のプレーンテキストファイルとして作り，クラス名(パッケージ名を含む)を一行に一つづつ書きます．
<p><b><u>使用されるプラグイン</u></b>
<p>ICPファイルまたは代替テキストファイルによって認識された各プラグインは，getSupportLevelメソッドによる対象データの自動判別により使用されます．
<p>例えば，画像をロードする場合，まず先頭のバイト列を使って全ての画像ロードプラグインのgetSupportLevelメソッドを呼びます．getSupportLevel処理が終わったら，サポートレベルの高いプラグインから順に全プラグインのloadImageメソッドが呼ばれ，画像ロードに成功した時点でロード処理を完了します．ただし，getSupportLevelでSUPPORT_NOTを返したプラグインだけはloadImageが呼ばれません．
<p>アーカイブ展開プラグインも同様です．まず全プラグインのgetSupportLevelが呼ばれ，その後SUPPORT_NOTでない全てのプラグインの中でサポートレベルの高い順にgetInputStreamが試みられます．
<p><b><u>キャッシュ</u></b>
<p>画像に関してはDNMLブラウザ側でキャッシュされるので，画像ロードプラグインでは単純に画像を読み込むだけの処理に留めておいてください．
<p>プラグインはロード時に作られたインスタンスが継続して利用されるので，アーカイブ展開プラグインでアーカイブファイルを開いたままにしておいた方が効率がいい場合は，内部でキャッシュしてください．
<p>画像先行ロード機能により，各ページで使用される画像はほぼ全てそのページの表示開始直後にロードされますので，当然プラグインが使用されるタイミングもその時になります，デバッグ時に戸惑わないよう，念のため．</p></blockquote>

<p>99/11/30 v0.1.21 エラーメッセージの出力を強化．LFGプラグインの透明色処理を修正．
<p>99/11/27 v0.1.20 Windows以外でポップアップメニューが出ないバグを修正．フォントマッピングが効いていなかったかもしれないのを修正．
<p>99/11/24 v0.1.19 ファイル名の大文字小文字を無視．アーカイブの中に入っているDNML文書から閲覧し始められるように変更．ToHeart付属のリーフフォントに対応．リーフフォントをインストールされているもの全てから集めて使うよう変更．WINDOWの開閉時のエフェクトをEF_OVERLAPに．
<p>99/11/02 v0.1.18 更新領域系のバグ潰しとアルゴリズムの変更により高速化．ウィンドウの開閉時のウェイトを無くす．しおりロード時に画像の先行ロード系がプラグイン関連のエラーを吐くバグを修正．しおりロード時にクリック待ちアイコンが消えるバグを修正．
<p>99/10/26 v0.1.17 無引数で起動後右クリックから文書を開くとリーフフォントが使えなかった不具合を修正．画像表示後に文字を表示せずにA HREFすると文字とウィンドウが隠れたままになる不具合を修正．文字を表示せずにPタグを置くと固まる不具合を修正．フォントのマッピングがない場合にFONTタグが失敗していた不具合を修正．
<p>99/10/25 v0.1.16 PDT10プラグインが特定の画像のロードに失敗する不具合を修正，C18プラグインを高速化(せいさん感謝です)．雫と痕のリーフフォントを利用可能に．文字表示位置のずれを修正．
<p>99/10/21 v0.1.15 文字レンダリングをMemoryImageSourceよりも内側に持ってくることに成功．文字リペイントがまともに．jdkのバージョンに関係なく文字アンチエイリアスを有効に．選択肢の強調表示のちらつきを解消．jdk1.3での文字欠け現象解消．フォントグリフ生成の内部プラグイン化(リーフフォントプラグインは0.1.16に同梱予定)．
<p>99/10/11 v0.1.14 PDT10プラグイン，透明情報を正しく扱うよう修正．左右の透明部分を同じ幅ずつカットして画像入れ替わりを高速化(せいさん感謝です)．アーカイブプラグインのdefファイル指定でファイル名使用時に大文字小文字の扱いが間違っていたのを修正．
<p>99/10/07 v0.1.13 画像の先行ロード系の不具合を修正．
<p>99/10/03 v0.1.12 Key/Tactics系プラグインを同梱．CURRENTエイリアスが最初の文書のディレクトリ位置に固定されていたのを修正．SystemImageLoaderがロックする可能性があったのを修正．ICON位置が指定されていた場合の不具合を修正．画像ロードに不具合があったのを修正．CLASSPATH指定がFile.separatorで終わっていた場合，DNML.classがカレントディレクトリ以外の位置にあると正しく動作しない不具合を修正．ALT付きHREFの次にALT無しのA HREFが来た時の動作を修正．空のALTを持つENDタグではダイアログボックスを表示しないように変更．引数なしでのスタートアップ時に操作説明を表示するように変更．Windows以外での動作時の不具合を修正．
<p>99/10/28 v0.1.11 .defファイルの仕様を拡張，Kanon等の拡張子がないアーカイブに対応．PLUGINタグでのアーカイブ展開プラグイン指定に対応．グラフィック周りを若干高速化．
<p>99/10/22 v0.1.10 プラグインロードに必要な.classファイル(ArchiveReaderPlugin，ImageLoaderPlugin，ImageData)をCIACパッケージの外側に出す．画像先行ロード機能を追加．動作が重くなっていたSCREENの開閉時の効果を元に戻す(文字表示のままアニメーションしない)．全体的に高速化．
<p>99/10/19 v0.1.9 CURTAIN中に各種ウェイトがそのままになっていたのを修正．二転三転していたプラグインインタフェースを確定．確定インタフェースに合わせ各種プラグインを変更．
<p>99/10/18 v0.1.8 FONTタグ関連バグ修正．CURTAINタグに対応．ACTのMODE属性でPASSとWAITに対応．&amp;amp;lt;/WAIT&amp;amp;gt;対応．ACTタグのALPHA属性のマスク画像指定対応．以前のバージョンとBOOKMARKが非互換に．
<p>99/10/11 v0.1.7 カードの演算で負数の扱いがおかしかったのを修正．同じく演算子無しの()の扱いがおかしかったのを修正．
<p>99/10/08 v0.1.6 文章表示にアンチエイリアスを適用．複数の文字エンコーディングに対応．package変更．
<p>99/09/20 v0.1.5 輪郭のぼかしにハイクオリティモード追加．通常の立ち絵には大きな効果を発揮するが，弱拡散型なのでToHeartタイトルロゴ等元々背景ピクセルが混じっている絵にはかえって逆効果(HQ固定)
<br>WIDTH，HEIGHT指定等による各種画像のリサイズ実装．画質優先．あまり使わない機能なので最適化もなし．
<br>テンプレート等をjarアーカイブにして添付．非ASCII文字のファイル名を解決するのにこれ以外に確実な方法はないと判断．
<br>JNIを使用したオーディオCDのサポートを暫定的に追加．現状Windowsのみサポート．Windows98標準のjviewではJNIは使用できないため，オーディオCDも使用不可．一部のドライブとの相性問題有り．CD-ROMドライブが複数ある場合は，コントロールパネル - マルチメディア - 音楽CD で選択されているドライブを使用．
<p>99/09/14 v0.1.4 ファイル名無指定での起動時にウィンドウが出なかったのを修正．輪郭をぼかす機能を追加(Enable固定)
<p>99/09/14 v0.1.3 Leaf関連プラグイン同梱．アーカイブ展開プラグインの扱い修正．終了時ダイアログのdispose修正．
<p>99/09/13 プラグイン関連情報更新．配布パッケージに変更なし．
<p>99/09/11 v0.1.2 パッケージング変更．<a href=https://web.archive.org/web/20060717182943/http://cgi.cyborg.ne.jp/~j-saito/cgi-bin/software/ciac/ target=_top>CIAC</a>により全クラスファイルを一つのクラスファイルにまとめる．使用方法に変更はなし．
<p>99/09/09 v0.1.1 bug fix. 文字の改行位置関連修正．&amp;amp;lt;・&amp;amp;gt;両演算子の動作修正．DNMLパーザ修正．画像の扱い修正．WINDOW動作修正．
<p>99/09/05 v0.1 初版公開</p></blockquote>
<hr size=0 width=100%25>
<p><a name=templates></a>同梱テンプレート
<blockquote>必要なテンプレートはすべて同梱されています．花梨さんによるWindows版DNMLに含まれるもの全てと，モルシさんによる完全版ToHeartテンプレート，せいさんによるPARTSテンプレート，楢方秋豆さんによるAIRテンプレートが含まれます．添付に関し承諾頂きありがとうございました．
<p>全てのテンプレートと&amp;quot;環境設定.DNML&amp;quot;の実体はtemplates.icpに含まれています．このファイルはZIPフォーマットですが，(ファイル名の文字エンコーディングをUTF-8に保つため)展開/圧縮には必ずJDK付属のJARツールを使用してください．各種テンプレートを編集したい場合は，templates.icpを展開して編集した後に圧縮をしてください．&amp;quot;環境設定.DNML&amp;quot;はsetenv.dnmlをINCLUDEしているだけですので，本来&amp;quot;環境設定.DNML&amp;quot;に書くべき事は全てsetenv.dnmlに書いてください．
<p>ご使用のOSで非ASCIIファイル名が問題とならない場合は，templates.icpの中身を，同名(templates.icp)のディレクトリに展開して使用してもかまいません．詳しくは<a href=%23limitation>制限事項</a>のPLAYERエイリアスに関する記述をご覧ください．
</p></blockquote>
<hr size=0 width=100%25>
<p><a name=run></a>とにかく動かす
<blockquote>Windowsでとにかく動くようにするには，
<p><a href=&amp;quot;https://web.archive.org/web/20060717182943/http://cgi.cyborg.ne.jp/~j-saito/cgi-bin/linkc.cgi?file=dnmlsdk&amp;amp;amp;url=http://cgi.cyborg.ne.jp/~j-saito/cgi-bin/software/dnml/dnml4j_0.2.6_full.exe&amp;quot;>DNML4J Windows Performance Pack version 0.2.6</a>
<p>をインストールするだけです．あとは，デスクトップやスタートメニューのアイコン，もしくはDNML文書のダブルクリックでDNML4Jが起動します．
</p></blockquote>
